name: Build Desktop Client

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  UPSTREAM_REF: v6.3.0

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout upstream
        uses: actions/checkout@v4
        with:
          repository: mattermost/desktop
          ref: ${{ env.UPSTREAM_REF }}
          path: desktop

      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          path: patches-repo

      - name: Apply custom config
        shell: bash
        run: cp patches-repo/patches/buildConfig.ts desktop/src/common/config/buildConfig.ts

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        working-directory: desktop
        run: npm ci

      - name: Build Windows MSI
        working-directory: desktop
        run: npm run package:windows-msi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          files: desktop/release/*.msi
          token: ${{ secrets.GITHUB_TOKEN }}

  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout upstream
        uses: actions/checkout@v4
        with:
          repository: mattermost/desktop
          ref: ${{ env.UPSTREAM_REF }}
          path: desktop

      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          path: patches-repo

      - name: Apply custom config
        run: cp patches-repo/patches/buildConfig.ts desktop/src/common/config/buildConfig.ts

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        working-directory: desktop
        run: npm ci

      - name: Build unsigned Mac app
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          npm run build-prod
          npx electron-builder --mac --x64 --arm64 --publish=never

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          files: |
            desktop/release/*.dmg
            desktop/release/*.zip
          token: ${{ secrets.GITHUB_TOKEN }}
